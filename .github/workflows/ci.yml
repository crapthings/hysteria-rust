name: "CI"

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - "index.html"
      - ".github/workflows/pages.yml"
  pull_request:
    branches:
      - main
      - dev
    paths-ignore:
      - "index.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  quality:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check format
        run: cargo fmt --all -- --check

      - name: Check vendored WFP format
        run: cargo fmt --manifest-path vendor/wfp/Cargo.toml -- --check

      - name: Check vendored netdev format
        run: cargo fmt --manifest-path vendor/netdev/Cargo.toml -- --check

      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test Linux workspace
        run: cargo test --locked --workspace

      - name: Test vendored HTTP/3
        run: cargo test --manifest-path vendor/h3/Cargo.toml --locked --lib --features i-implement-a-third-party-backend-and-opt-into-breaking-changes

      - name: Test vendored QUIC
        run: cargo test --manifest-path vendor/quinn-proto/Cargo.toml --locked --lib

  test-and-package:
    if: github.event_name == 'workflow_dispatch'
    name: Test and package (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            variant: baseline
          - label: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            variant: baseline
          - label: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            variant: baseline
          - label: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            variant: baseline
          - label: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            variant: baseline
          - label: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            variant: baseline
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.label }}

      - name: Test
        run: cargo test --locked --workspace

      - name: Lint Windows WFP wrapper
        if: runner.os == 'Windows'
        run: cargo clippy --manifest-path vendor/wfp/Cargo.toml --lib -- -D warnings

      - name: Package native binary
        run: python scripts/package_rust.py --target ${{ matrix.target }} --variant ${{ matrix.variant }}

      - name: Upload native binary
        uses: actions/upload-artifact@v7
        with:
          name: hysteria-rust-${{ matrix.label }}
          path: build/rust/*
          retention-days: 1

  cross-package:
    if: github.event_name == 'workflow_dispatch'
    name: Cross-package (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-arm
            target: armv7-unknown-linux-gnueabihf
            toolchain: 1.88.0
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Install pinned Cross
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 154b4ead7e639c7597d9e4e626b9c1c1e37608c0 --locked

      - name: Package cross-compiled binary
        run: python scripts/package_rust.py --builder cross --toolchain ${{ matrix.toolchain }} --target ${{ matrix.target }} --variant ${{ matrix.variant || 'baseline' }}

      - name: Upload cross-compiled binary
        uses: actions/upload-artifact@v7
        with:
          name: hysteria-rust-${{ matrix.label }}
          path: build/rust/*
          retention-days: 1

  interoperability:
    name: Go/Rust interoperability
    runs-on: ubuntu-latest
    steps:
      - name: Check out Rust implementation
        uses: actions/checkout@v7

      - name: Check out pinned Go implementation
        uses: actions/checkout@v7
        with:
          repository: apernet/hysteria
          ref: 62d1016707af21b91e5fb6070311d9f016ff2754
          path: upstream-go

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache-dependency-path: upstream-go/app/go.sum

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build pinned Go binary
        working-directory: upstream-go/app
        run: go build -trimpath -o "${RUNNER_TEMP}/hysteria-go" .

      - name: Test both client/server directions
        env:
          HYSTERIA_GO_BIN: ${{ runner.temp }}/hysteria-go
          HYSTERIA_DISABLE_UPDATE_CHECK: "1"
        run: cargo test --locked --package hysteria-cli --test go_interop -- --nocapture

      - name: Test Chrome runtime against Go server
        env:
          HYSTERIA_GO_BIN: ${{ runner.temp }}/hysteria-go
          HYSTERIA_DISABLE_UPDATE_CHECK: "1"
        run: cargo test --locked --package hysteria-cli --lib chrome_runtime_go_tcp_udp_interop -- --ignored --nocapture

  security:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache audit tool
        uses: Swatinem/rust-cache@v2
        with:
          key: cargo-audit-0.22.2
          cache-targets: false

      - name: Install pinned cargo-audit
        run: |
          if ! cargo audit --version 2>/dev/null | grep -q '0.22.2$'; then
            cargo install cargo-audit --version 0.22.2 --locked
          fi

      - name: Audit Cargo.lock
        run: cargo audit
